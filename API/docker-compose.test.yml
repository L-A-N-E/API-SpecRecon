services:
  db_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: specrecon_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  junit_runner:
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://db_test:3306/specrecon_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=root
      - DB_PASS=root
    command: mvn clean test
