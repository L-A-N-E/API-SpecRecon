server.ssl.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/specrecon_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:specreconpass}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

app.security.jwt-secret=test-only-jwt-secret-key-must-have-at-least-512-bits-for-hs512-1234567890
app.security.jwt-expiration=3600000
app.security.jwt-refresh-expiration=86400000
app.security.payload-signature-key=test-only-payload-signature-key-min-32-chars
app.security.data-encryption-key=CYXaKVmhzW1nKaaFdxUWgsFTYprKo1GZ9S/o4/X0LSI=
app.security.pseudonymization-salt=test-only-pseudonymization-salt

logging.level.org.springframework.security=WARN
logging.level.br.com.lane.SpecRecon=INFO